services:
  - type: web
    name: mohafez-baseet-api
    runtime: node
    rootDir: backend
    plan: starter # persistent disks need a paid plan
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /var/data/database.db
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
